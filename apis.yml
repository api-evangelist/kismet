aid: kismet
name: Kismet
description: 'Kismet is an Australian digital-health marketplace that connects people with disability
  — primarily National Disability Insurance Scheme (NDIS) participants — to verified, available service
  providers across occupational therapy, speech therapy, physiotherapy, support coordination and plan
  management. The platform pairs a searchable provider marketplace and care index with a Concierge AI
  matching service that builds a shortlist of suitable, available providers within 48 hours, alongside
  budget-tracking and plan-management tools for participants. Kismet is backed by Prosus Ventures and
  ships consumer iOS and Android apps. This profile was added to the API Evangelist network as a
  portfolio-lead stub; no public developer API, documentation, or SDK surface was found during enrichment.'
